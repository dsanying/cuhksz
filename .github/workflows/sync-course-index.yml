name: Sync course resource index

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: course-index-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      LANZOU_CLASSIC_COOKIE: ${{ secrets.LANZOU_CLASSIC_COOKIE }}
      LANZOU_CLASSIC_ROOT_FOLDER_ID: "13698202"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Lanzou credential
        run: |
          if [ -z "$LANZOU_CLASSIC_COOKIE" ]; then
            echo "::error::缺少 LANZOU_CLASSIC_COOKIE，无法同步课程索引。"
            exit 1
          fi
      - name: Build the latest index from Lanzou
        run: |
          node tools/course-resources/sync-lanzou-index.mjs --output "$RUNNER_TEMP/lanzou-manifest.json"
          COURSE_RESOURCE_SOURCE_PATH="$RUNNER_TEMP/lanzou-manifest.json" COURSE_RESOURCE_OUTPUT_PATH="$RUNNER_TEMP/manifest.json" node tools/course-resources/generate-manifest.mjs
      - name: Publish data branch without deploying the site
        env:
          DATA_BRANCH: course-index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DATA_BRANCH" || true
          if git show-ref --verify --quiet "refs/remotes/origin/$DATA_BRANCH"; then
            git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
          else
            git checkout --orphan "$DATA_BRANCH"
            git rm -rf .
          fi
          cp "$RUNNER_TEMP/manifest.json" manifest.json
          printf '%s\n' '# Course resource index' '' 'Automatically refreshed from Lanzou Classic. Do not edit by hand.' > README.md
          git add manifest.json README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(course): 同步蓝奏云索引"
          git push origin "HEAD:$DATA_BRANCH"
