# Butterfly 主题配置：站点配置与主题源码分离，主题升级时不会覆盖本文件。

nav:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  校园生活:
    入学清单: /checklist/ || fas fa-clipboard-check
    书院与住宿: /dorm/ || fas fa-building
    校园地图: /map/ || fas fa-map-location-dot
    学校联系方式: /contact-school/ || fas fa-address-book
    IT 指南: /guide-IT/ || fas fa-laptop
  学业成长:
    课程资料: 'https://my.feishu.cn/wiki/RjSzwtTIXi9OEVkFXN8cn84Enib?from=from_copylink || fas fa-book'
    课程评价: 'https://my.feishu.cn/wiki/LEtLwn9k0iAXRskXnOzcpuNGncb?from=from_copylink || fas fa-star'
  资源社区:
    重要资料: /material/ || fas fa-folder-open
    中英字典: /dictionary/ || fas fa-language
    外部资源: /social/ || fas fa-users
  关于本站: /about/ || fas fa-circle-info

favicon: /img/pwa/favicon.png
avatar:
  img: /img/avatar.jpg
  effect: false

# 全站友链图标加载失败时，统一使用本站默认头像兜底。
error_img:
  flink: /img/avatar.jpg

disable_top_img: true
footer_img: false
background:

cover:
  index_enable: false
  aside_enable: false
  archives_enable: false

# 官方瀑布流卡片布局；不强制为文章添加封面图。
index_layout: 6
index_post_content:
  method: false

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: false

code_blocks:
  theme: darker
  copy: true
  language: true
  shrink: false

toc:
  post: true
  page: true
  number: true
  expand: false
  scroll_percent: true

# 文章分享、图片查看与系列导航。
share:
  use: sharejs
  sharejs:
    sites: wechat,weibo,qq
lightbox: medium_zoom
series:
  enable: true
  orderBy: date
  order: 1
  number: true

post_copyright:
  enable: true
  decode: false
  author_href: /
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

search:
  use: local_search
  placeholder: 搜索站内文章
  local_search:
    preload: true
    top_n_per_article: 1
    unescape: true

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: false
    tag: false
    category: true
  card_author:
    enable: true
    description: '<img src="/cuhksz/img/dsanying_search.jpg" alt="微信公众号：暗夜孤残影" style="width: 180px; max-width: 100%; height: auto;">'
    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/dsanying/cuhksz
  card_announcement:
    enable: true
    content: '<strong>资料征集</strong><br>持续收集电子教材、历年 Exam/Quiz、Cheating Paper 等课程资料。请发送至 <a href="mailto:dsanying@qq.com">dsanying@qq.com</a>，并注明“届别 + 网名/姓名”；未注明默认匿名。'
  card_recent_post:
    enable: false
    limit: 5
    sort: date
  card_categories:
    enable: false
    limit: 8
    expand: none
  card_tags:
    enable: false
  card_archives:
    enable: false
    type: yearly
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 2024/08/21 00:00:00

# 迁移旧站已有的站点统计：保留总浏览量，隐藏独立访客数。
busuanzi:
  site_uv: false
  site_pv: true
  page_pv: true
wordcount:
  enable: true
  post_wordcount: false
  min2read: false
  total_wordcount: true

footer:
  nav:
  owner:
    enable: true
    since: 2024
  copyright:
    enable: false
  custom_text:

darkmode:
  enable: true
  button: true
  autoChangeMode: 1

readmode: true
rightside_scroll_percent: true
rightside_item_order:
  enable: true
  hide: readmode,hideAside
  show: darkmode,toc
rightside_config_animation: false

category_ui: index
tag_ui: index
rounded_corners_ui: true
display_mode: light

# 统一使用低饱和石板灰，避免默认亮蓝在页脚、翻页和目录选中态中过于突兀。
theme_color:
  enable: true
  main: '#48515c'
  paginator: '#596574'
  button_hover: '#36404b'
  text_selection: '#596574'
  link_color: '#456d9f'
  hr_color: '#596574'
  toc_color: '#596574'
  blockquote_padding_color: '#596574'
  blockquote_background_color: '#596574'
  scrollbar_color: '#596574'
  meta_theme_color_light: '#ffffff'
  meta_theme_color_dark: '#111318'

# 全站正文基准字号；标题、导航等相对字号会随此基准等比例调整。
font:
  global_font_size: 16px

# 使用 Butterfly 官方 inject 机制加载站点级交互微调。
inject:
  head:
    - <link rel="stylesheet" href="/cuhksz/css/butterfly-overrides.css">
    - <link rel="stylesheet" href="/cuhksz/css/campus-terms.css">
    - <link rel="stylesheet" href="/cuhksz/css/resource-search.css">
    - <link rel="stylesheet" href="/cuhksz/css/social-resources.css">
  bottom:
    - <script defer src="/cuhksz/js/card-click.js"></script>
    - <script defer src="/cuhksz/js/resource-search.js"></script>
    - <script defer src="/cuhksz/js/campus-terms.js"></script>

pjax:
  enable: false
lazyload:
  enable: true
  native: true
  field: site
photofigcaption: true
pwa:
  enable: false

# 从旧站迁移的站长验证信息；不含任何新增的第三方分析服务。
site_verification:
  - name: msvalidate.01
    content: 394CFA1E21959CC3AF8C3B1E67448E75
  - name: google-site-verification
    content: 4cifgezwL6njlN07d6eHkI3qGhmCYo9x4rsWcoOE0-E

Open_Graph_meta:
  enable: true

# 内置资源及第三方资源均从本地生成目录加载。
CDN:
  internal_provider: local
  third_party_provider: local
