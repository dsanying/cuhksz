# 只覆盖 Solitude 的必要选项；其余均跟随主题 4.x 的官方默认值。
site:
  name:
    class: text
    custom: 港中深资源站
  icon: /img/logo.png

nav:
  menu:
    首页: /
    校园生活:
      入学清单: /checklist/ || fas fa-clipboard-check
      书院与住宿: /dorm/ || fas fa-building-columns
      校园地图: /map/ || fas fa-map-location-dot
      学校联系方式: /contact-school/ || fas fa-address-book
      IT 指南: /guide-IT/ || fas fa-laptop-code
    学业成长:
      课程资料: /course/ || fas fa-book-open
      选课与攻略: /categories/学业/ || fas fa-graduation-cap
    资源社区:
      重要资料: /material/ || fas fa-folder-open
      社群与资源: /social/ || fas fa-users
    关于:
      本站: /about/ || fas fa-circle-info

hometop:
  enable: false

aside:
  home:
    noSticky: about
    Sticky: allInfo
  post:
    noSticky: about
    Sticky: newestPost
  page:
    noSticky: about
    Sticky: newestPost,allInfo
  position: 1
  my_card:
    author:
      img: /cuhksz/img/avatar.jpg
    description: ''
    content: ''
    information:
      GitHub: https://github.com/dsanying/cuhksz || fab fa-github
  toc:
    post: true
    page: true
    vague: true
  tags:
    enable: false
    limit: 12
  siteinfo:
    postcount: true
    wordcount: true
    pv: true
    uv: true
    updatetime: true
    runtimeenable: true
    runtime: '2024-08-20 00:00:00'

index_post_list:
  direction: column
  column: 3
  cover: both

page:
  archives: 0
  tags: false

post:
  default:
    locate: Shenzhen, China
    copyright:
      enable: true
      author: /img/avatar.jpg
  meta:
    date: true
    updated: true
    locate: false
    wordcount: false
    readtime: false
    pv: false
    comment: false
  share:
    enable: true
    list:
      - link
      - qrcode

theme_color:
  light: '#64748b'
  dark: '#27272a'
  nav_hover_text:
    light: '#ffffff'
    dark: '#f5f5f5'

display_mode:
  type: auto
  universe: false

font:
  font-size: 16px
  code-font-size: 15px
  font-family: '"Noto Serif SC", "Songti SC", STSong, serif'
  code-font-family: '"SFMono-Regular", Consolas, monospace'

footer:
  information:
    left: {}

loading:
  fullpage: false
  pace: true

rightside:
  enable: true
  percent: true
  hide:
    enable: true
    translate: true
    mode: true
    aside: true

search:
  enable: true
  type: local
  local:
    preload: true

highlight:
  enable: true
  limit: 200
  copy: true
  expand: true
  theme: mac
  color: default

pwa:
  enable: true
  manifest: /manifest.json
  theme_color: '#27272a'
  mask_icon: /img/logo.png
  apple_touch_icon: /img/logo.png
  bookmark_icon: /img/logo.png
  favicon_32_32: /img/pwa/favicon_32.png
  favicon_16_16: /img/pwa/favicon_16.png

verify_site:
  - name: msvalidate.01
    content: 394CFA1E21959CC3AF8C3B1E67448E75
  - name: google-site-verification
    content: 4cifgezwL6njlN07d6eHkI3qGhmCYo9x4rsWcoOE0-E

wordcount: true
busuanzi: true

console:
  enable: true
  card:
    tags: false
    archive: month

lightbox: true
mediumZoom: true
lazyload:
  enable: true
  field: post
  errorimg: /img/error_load.avif

CDN:
  internal: local
  third_party: cdnjs
  version: true

css_prefix: false
